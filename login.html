<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Vozes na Tech</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="assets/logo_vozes.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="login-page-bg">

  <div class="login-card-split">
    <!-- LEFT BANNER -->
    <div class="login-left-banner">
      <a href="index.html" class="logo">
        <img src="assets/logo_vozes.png" alt="Vozes na Tech" class="logo-img" />
        <div class="logo-text-brand">
          VOZES<br><small>NA TECH</small>
        </div>
      </a>

      <div>
        <h2 style="color: #FFFFFF; font-size: 32px; margin-bottom: 12px;">Bem-vinda de volta! ✨</h2>
        <p style="color: rgba(255, 255, 255, 0.85); font-size: 16px;">Que bom ter você aqui.</p>
        <p style="color: rgba(255, 255, 255, 0.7); font-size: 14px; margin-top: 24px;">
          Transformando vidas através da tecnologia.
        </p>
      </div>

      <div>
        <img src="assets/logo_vozes.png" alt="Onda sonora" style="width: 80px; opacity: 0.4;" />
      </div>
    </div>

    <!-- RIGHT FORM -->
    <div class="login-right-form">
      <h3 style="font-size: 28px; font-weight: 700; margin-bottom: 32px;">Entrar na sua conta</h3>

      <form action="dashboard.html" method="GET" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" class="form-control" placeholder="exemplo@email.com" value="davi.silva@email.com" required />
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <div style="position: relative;">
            <input type="password" id="password" class="form-control" placeholder="••••••••" value="12345678" required />
            <button type="button" style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--secondary-text); cursor: pointer;" onclick="togglePasswordVisibility()">
              <i class="fa-regular fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <div style="display: flex; justify-content: flex-end; margin-bottom: 24px;">
          <a href="#" style="color: var(--secondary); font-size: 14px; font-weight: 500;">Esqueceu sua senha?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">
          Entrar
        </button>
      </form>

      <div style="display: flex; align-items: center; margin: 24px 0; color: var(--secondary-text); font-size: 13px;">
        <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
        <span style="padding: 0 12px;">ou continue com</span>
        <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
      </div>

      <button type="button" class="btn btn-secondary" style="width: 100%; border-color: var(--border-color); color: var(--primary-text);" onclick="window.location.href='dashboard.html';">
        <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right: 8px;">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Entrar com Google
      </button>

      <div style="text-align: center; margin-top: 32px; font-size: 14px; color: var(--secondary-text);">
        Ainda não tem uma conta? <a href="login.html" style="color: var(--secondary); font-weight: 600;">Criar conta</a>
      </div>
    </div>
  </div>

  <script>
    function togglePasswordVisibility() {
      const passInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.className = 'fa-regular fa-eye-slash';
      } else {
        passInput.type = 'password';
        eyeIcon.className = 'fa-regular fa-eye';
      }
    }
  </script>
</body>
</html>
